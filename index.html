<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciador de Assinaturas</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 700px;
  text-align: center;
}

.lista {
  margin-top: 30px;
}

.cliente {
  background: #111;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 15px;
  box-shadow: 0 0 10px rgba(255,255,255,0.1);
  position: relative;
  text-align: left;
}

.nome {
  font-size: 24px;
  font-weight: bold;
  color: #0d6efd;
  margin-bottom: 10px;
}

.vencimento {
  font-size: 22px;
  font-weight: bold;
  color: #ff4d4d;
  margin-bottom: 15px;
}

.texto-original {
  font-size: 14px;
  color: #ccc;
  white-space: pre-wrap;
  border-top: 1px solid #333;
  padding-top: 10px;
}

.remover {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #ff4d4d;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>Gerenciador de Assinaturas</h1>
  <div class="lista" id="listaClientes"></div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsvYJf3XE6CzmXSTOfoDw0CbI0aqSaz5ddWDjeUq9iU88n73m8wI-Fs_ZMh6wMg3d4wUnZhBbv9Erd/pub?output=csv';

function extrairDados(texto) {
  const nomeMatch = texto.match(/Usu[aá]rio:\s*(.*)/i);
  const nome = nomeMatch ? nomeMatch[1].trim() : 'Cliente não identificado';

  const dataMatch = texto.match(/(\d{2}\/\d{2}\/\d{4}\s\d{2}:\d{2})/);
  const data = dataMatch ? dataMatch[1] : 'Data não informada';

  return { nome, data };
}

fetch(CSV_URL)
  .then(r => r.text())
  .then(csv => {
    const lista = document.getElementById('listaClientes');
    lista.innerHTML = '';

    // separa linhas
    const linhas = csv.split('\n');

    linhas.forEach(linha => {
      // remove aspas extras
      linha = linha.replace(/^"|"$/g, '').trim();
      if (!linha) return;

      // cada coluna pode ter um "quadrado"
      const colunas = linha.split('","');

      colunas.forEach(texto => {
        texto = texto.trim();
        if (!texto) return;

        const { nome, data } = extrairDados(texto);

        const div = document.createElement('div');
        div.className = 'cliente';

        const btn = document.createElement('button');
        btn.className = 'remover';
        btn.textContent = 'Remover';
        btn.onclick = () => div.remove();

        div.innerHTML = `
          <div class="nome">${nome}</div>
          <div class="vencimento">Vencimento: ${data}</div>
          <div class="texto-original">${texto}</div>
        `;

        div.appendChild(btn);
        lista.appendChild(div);
      });
    });
  })
  .catch(err => {
    console.error(err);
    document.getElementById('listaClientes').innerHTML =
      '<p>Erro ao carregar a planilha.</p>';
  });
</script>

</body>
</html>
