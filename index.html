<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Espelho da Planilha</title>

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 900px;
}

h1 {
  text-align: center;
  color: #0d6efd;
  margin-bottom: 30px;
}

.linha {
  display: flex;
  align-items: flex-start;
  background: #111;
  border: 1px solid #222;
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 8px;
  gap: 12px;
}

.texto {
  flex: 1;
  white-space: pre-wrap;
  font-size: 14px;
  color: #ddd;
}

.remover {
  background: #ff4d4d;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  height: 30px;
}

.remover:hover {
  opacity: 0.85;
}
</style>
</head>

<body>

<div class="container">
  <h1>Espelho da Planilha</h1>
  <div id="lista"></div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsvYJf3XE6CzmXSTOfoDw0CbI0aqSaz5ddWDjeUq9iU88n73m8wI-Fs_ZMh6wMg3d4wUnZhBbv9Erd/pub?output=csv';

fetch(CSV_URL)
  .then(r => r.text())
  .then(csv => {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';

    const linhas = csv.split('\n');

    linhas.forEach(linha => {
      linha = linha.replace(/\r/g, '').trim();
      if (!linha) return;

      // remove aspas externas do CSV
      linha = linha.replace(/^"|"$/g, '');

      // separa colunas (cada célula)
      const colunas = linha.split('","');

      colunas.forEach(texto => {
        texto = texto.trim();
        if (!texto) return;

        const div = document.createElement('div');
        div.className = 'linha';

        const span = document.createElement('div');
        span.className = 'texto';
        span.textContent = texto;

        const btn = document.createElement('button');
        btn.className = 'remover';
        btn.textContent = 'Remover';
        btn.onclick = () => div.remove();

        div.appendChild(span);
        div.appendChild(btn);
        lista.appendChild(div);
      });
    });
  })
  .catch(() => {
    document.getElementById('lista').innerHTML =
      '<p>Erro ao carregar a planilha.</p>';
  });
</script>

</body>
</html>
